<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin | GDG Africa University</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>(function(){var d=document.documentElement;d.classList.add('js');try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')d.dataset.theme=t}catch(e){}})();</script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="icon" type="image/jpeg" href="/images/gdg-logo.jpg" />
  </head>
  <body class="font-sans antialiased min-h-[100svh]">
    <!-- Sign in -->
    <main id="signin" class="min-h-[100svh] grid place-items-center px-4" hidden>
      <div class="w-full max-w-[420px] rounded-3xl border border-brandBorder bg-brandBgTertiary p-8">
        <img src="/images/gdg-logo.jpg" alt="" width="48" height="48" class="w-12 h-12 rounded-full" />
        <h1 class="font-display font-extrabold text-3xl mt-6">Club admin</h1>
        <p class="mt-2 text-brandTextSecondary">Sign in with the club's Google account.</p>
        <div id="google-btn" class="mt-6 min-h-[44px]"></div>
        <button id="dev-login" type="button" class="btn-press mt-3 w-full border border-brandBorder rounded-full py-3 font-semibold" hidden>Dev sign-in (localhost only)</button>
        <p id="signin-msg" class="mt-4 text-sm text-google-red min-h-5" role="alert"></p>
      </div>
    </main>

    <!-- App -->
    <div id="app" hidden>
      <header class="sticky top-0 z-40 bg-brandBgPrimary/90 backdrop-blur border-b border-brandBorder">
        <div class="max-w-[1280px] mx-auto px-4 md:px-6 h-16 flex items-center gap-3">
          <a href="/" class="flex items-center gap-2 shrink-0" title="View site"><img src="/images/gdg-logo.jpg" alt="" width="30" height="30" class="w-[30px] h-[30px] rounded-full" /><span class="font-display font-bold hidden sm:inline">Admin</span></a>
          <nav id="tabs" class="flex-1 flex gap-1 overflow-x-auto h-scroll -mx-1 px-1" aria-label="Sections"></nav>
          <button type="button" data-theme-toggle class="w-10 h-10 grid place-items-center rounded-full hover:bg-brandBgSecondary shrink-0" aria-label="Toggle theme">
            <svg class="w-5 h-5 dark:hidden" aria-hidden="true"><use href="/img/icons.svg#moon"></use></svg><svg class="w-5 h-5 hidden dark:block" aria-hidden="true"><use href="/img/icons.svg#sun"></use></svg>
          </button>
          <button id="signout" type="button" class="text-sm font-semibold px-3 py-2 rounded-full hover:bg-brandBgSecondary shrink-0">Sign out</button>
        </div>
      </header>
      <main id="view" class="max-w-[1280px] mx-auto px-4 md:px-6 py-8 md:py-12"></main>
    </div>

    <!-- Editor drawer -->
    <div id="drawer" class="modal-overlay !items-stretch !justify-end !p-0" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
      <form id="editor" class="h-full w-full max-w-[640px] bg-brandBgTertiary border-l border-brandBorder flex flex-col" novalidate>
        <div class="flex items-center justify-between gap-3 px-5 md:px-7 h-16 border-b border-brandBorder shrink-0">
          <h2 id="drawer-title" class="font-display font-bold text-xl truncate">Edit</h2>
          <button type="button" data-close-drawer class="w-10 h-10 grid place-items-center rounded-full hover:bg-brandBgSecondary" aria-label="Close"><svg class="w-5 h-5" aria-hidden="true"><use href="/img/icons.svg#x"></use></svg></button>
        </div>
        <div id="editor-fields" class="flex-1 overflow-y-auto px-5 md:px-7 py-6 space-y-5"></div>
        <div class="flex items-center gap-2 px-5 md:px-7 py-4 border-t border-brandBorder shrink-0">
          <button type="submit" class="btn-press bg-google-blue text-white font-semibold px-6 py-3 rounded-full hover:bg-google-blue-dark">Save</button>
          <button type="button" data-close-drawer class="font-semibold px-4 py-3 rounded-full hover:bg-brandBgSecondary">Cancel</button>
          <button type="button" id="delete-btn" class="ml-auto font-semibold px-4 py-3 rounded-full text-google-red hover:bg-google-red/10">Delete</button>
        </div>
      </form>
    </div>

    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] px-5 py-3 rounded-full bg-brandTextPrimary text-brandBgPrimary font-semibold shadow-lg opacity-0 pointer-events-none transition-opacity" role="status"></div>
    <script type="module" src="/js/admin.js"></script>
  </body>
</html>
